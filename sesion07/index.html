<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header></header>

    <section>
    </section>

    <main>
        <form method="get" action="saludo.html">

        <label for="inputNombre">Nombre completo:</label>
        <input type="text" required id="inputNombre" name="nombreCompleto" placeholder="ej: Juan Pérez">

        <label for="inputEmail">Correo electrónico:</label>
        <input type="email" required id="inputEmail" name="correo" placeholder="ej: juan@ejemplo.com">

        <label for="inputEdad">Edad:</label>
        <input type="number" min="16" id="inputEdad" name="edad" placeholder="ej: 18">

        <fieldset>
            <legend>Fecha de nacimiento:</legend>
            <label for="inputFecha">Fecha de nacimiento:</label>
            <input type="date" id="inputFecha" name="fechaNacimiento">
        </fieldset>


        <fieldset>
            <legend>Nombre del jugador:</legend>
            <label for="inputNickname">Nickname</label>
            <input type="text" required minlength="3" maxlength="15" id="inputNickname" name="nickname" placeholder="ej: Juan123">
        </fieldset>

        <fieldset>
            <legend>Contraseña:</legend>
            <label for="inputPassword">Contraseña:</label>
            <input type="password" required id="inputPassword" name="password" placeholder="ej: ********">
        </fieldset>

        <fieldset>
            <legend>Videojuego del torneo:</legend>
            <label for="inputJuego">Videojuego</label>
            <select id="inputJuego" name="videojuego">
                <option value="Valorant">Valorant</option>
                <option value="Fortnite">Fortnite</option>
                <option value="LeagueOfLegends">League of Legends</option>
                <option value="CS2">Counter Strike 2</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Plataforma:</legend>
            <label for="PC">PC</label>
            <input type="radio" value="PC" id="PC" name="plataforma">

            <label for="PlayStation">PlayStation</label>
            <input type="radio" value="PlayStation" id="PlayStation" name="plataforma">

            <label for="Xbox">Xbox</label>
            <input type="radio" value="Xbox" id="Xbox" name="plataforma">
        </fieldset>

        <fieldset>
            <legend>Disponibilidad horaria:</legend>

            <label for="inputManana">Mañana</label>
            <input type="checkbox" value="Manana" id="inputManana" name="disponibilidad">

            <label for="inputTarde">Tarde</label>
            <input type="checkbox" value="Tarde" id="inputTarde" name="disponibilidad">

            <label for="inputNoche">Noche</label>
            <input type="checkbox" value="Noche" id="inputNoche" name="disponibilidad">
        </fieldset>

        <fieldset>
            <legend>Comentarios adicionales:</legend>
            <label for="inputComentarios">Comentarios:</label>
            <textarea id="inputComentarios" name="comentarios" placeholder="Escribe aquí tus comentarios"></textarea>
        </fieldset>

        <fieldset>
            <legend>Aceptación de las normas:</legend>
            <label for="inputNormas">Acepto las normas</label>
            <a href="normas.html">Ver normas del torneo</a>
            <input type="checkbox" required id="inputNormas" name="normas">
        </fieldset>

        <div class="buttons">
            <button type="reset">Limpiar formulario</button>
            <button type="submit">Inscripción</button>
        </div>

        </form>
    </main>

</body>
</html>
